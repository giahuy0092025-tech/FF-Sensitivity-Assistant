name: Build Android Application

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Mã Nguồn
        uses: actions/checkout@v4

      - name: Thiết lập JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Kiểm tra và Khởi tạo Gradle Wrapper nếu thiếu
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "Chưa tìm thấy gradlew, tiến hành khởi tạo Gradle Wrapper..."
            gradle wrapper
          fi
          chmod +x ./gradlew

      - name: Biên dịch Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Thiết lập Keystore cho bản Release
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore

      - name: Biên dịch Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Tải lên Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Tải lên Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
