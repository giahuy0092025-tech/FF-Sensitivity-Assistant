name: Build Android Application

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Nâng cấp lên actions/checkout@v7 (tương thích Node.js 24)
      - name: Checkout Mã Nguồn
        uses: actions/checkout@v7

      # Nâng cấp lên actions/setup-java@v5 (tương thích Node.js 24)
      - name: Thiết lập JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Cấp quyền thực thi cho Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Biên dịch Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Thiết lập Keystore cho bản Release
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore

      - name: Biên dịch Release APK
        run: ./gradlew assembleRelease --stacktrace

      # Nâng cấp lên actions/upload-artifact@v5 (tương thích Node.js 24)
      - name: Tải lên Debug APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Tải lên Release APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
